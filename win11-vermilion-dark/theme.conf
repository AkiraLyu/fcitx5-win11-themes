[Metadata]
Name=Windows 11 Vermilion Dark
Name[zh_CN]=Windows 11 朱砂深色
Version=1
Author=fcitx5-win11-themes contributors; sanweiya (Mellow base)
Description=Windows 11 candidate panel with the original Mellow Vermilion palette.

[InputPanel]
NormalColor=#ffffff
HighlightCandidateColor=#ffffff
LabelTextSizeFactor=100
CommentTextSizeFactor=85
HighlightColor=#ffffff
HighlightBackgroundColor=#9e322e
EnableBlur=False
FullWidthHighlight=True
PageButtonAlignment=Last Candidate

# Optional colors use a Value child in Fcitx5 configuration.
[InputPanel/CandidateLabelColor]
Value=#c5c5c5

[InputPanel/HighlightCandidateLabelColor]
Value=#ffffff

[InputPanel/CandidateCommentColor]
Value=#c5c5c5

[InputPanel/HighlightCandidateCommentColor]
Value=#ffffff

[InputPanel/Background]
Image=panel.svg
Color=#151515
BorderColor=#373737

# Nine-slice margins preserve the 8 px corners and shadow.
[InputPanel/Background/Margin]
Left=17
Right=17
Top=17
Bottom=17

[InputPanel/Highlight]
Image=highlight.svg
Color=#9e322e
# Warm apricot (#ffe0b2) contrasts with the Vermilion highlight.
# Keep the indicator at 3 x 16 px instead of stretching it with text.
Overlay=selection.svg
Gravity=Center Left
OverlayOffsetX=3
OverlayOffsetY=0
HideOverlayIfOversize=True

[InputPanel/Highlight/Margin]
Left=10
Right=6
Top=4
Bottom=5

[InputPanel/Highlight/HighlightClickMargin]
Left=0
Right=0
Top=0
Bottom=0

# Content margins include the transparent 8 px shadow on each side.
[InputPanel/ContentMargin]
Left=12
Right=12
Top=10
Bottom=10

[InputPanel/TextMargin]
# Reserve room for the indicator while keeping candidates close together.
Left=11
Right=7
# Center Noto Sans CJK SC Regular 10px within its 15 px line box.
Top=4
Bottom=5

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=0
Right=0
Top=0
Bottom=0

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=0
Right=0
Top=0
Bottom=0

# Exclude the shadow from the Wayland input region and caret positioning.
[InputPanel/ShadowMargin]
Left=8
Right=8
Top=8
Bottom=8

[Menu]
NormalColor=#ffffff
HighlightCandidateColor=#ffffff
Spacing=2

[Menu/Background]
Image=panel.svg
Color=#151515
BorderColor=#373737

[Menu/Background/Margin]
Left=17
Right=17
Top=17
Bottom=17

[Menu/Highlight]
Image=highlight.svg
Color=#9e322e

[Menu/Highlight/Margin]
Left=10
Right=10
Top=4
Bottom=4

[Menu/Separator]
Color=#373737

[Menu/CheckBox]
Image=check.svg

[Menu/SubMenu]
Image=submenu.svg

[Menu/ContentMargin]
Left=13
Right=13
Top=13
Bottom=13

[Menu/TextMargin]
Left=12
Right=12
Top=6
Bottom=6
